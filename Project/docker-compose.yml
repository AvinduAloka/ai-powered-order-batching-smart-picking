name: xtrena

services:
  # ───────────────────────── ① DATABASE ─────────────────────────
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "14330:1433"          # DEV වලට: host එකේ tools (SSMS, dotnet ef) DB එකට යන්න.
                             # ★ Demo/SRS §4.4 එකට මේ ඉතාරින්න — network එකේ ඇතුළෙන් api එකට ඕන නෑ.
    volumes:
      - sqldata:/var/opt/mssql   # ★ data persist — container delete කළත් DB නැති නෑ
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -No -l 3 -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # ───────────────────── ② OPTIMIZATION (FastAPI) ─────────────────────
  optimization:
    build: ./optimization            # ← ④ Dockerfile එක use කරනවා
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload   # ★ LIVE
    volumes:
      - ./optimization/app:/app/app  # ★ LIVE: host code container එකට. හැබැයි app\ විතරයි!
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/meta/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ───────────────────────── ③ API (.NET) ─────────────────────────
  api:
    image: mcr.microsoft.com/dotnet/sdk:10.0    # SDK image — watch එකට ඕන (runtime image එකේ නෑ)
    working_dir: /src
    command: sh -c "dotnet restore Xtrena.Api/Xtrena.Api.csproj && dotnet watch run --project Xtrena.Api/Xtrena.Api.csproj --no-launch-profile"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      XTRENA_CONTAINER: "1" 
      DOTNET_USE_POLLING_FILE_WATCHER: "1"      # ★ Windows bind mount fs-events එන්නේ නෑ — polling ඕන
      ConnectionStrings__Default: "Server=db;Database=XtrenaDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=true;MultipleActiveResultSets=true"
      Optimization__BaseUrl: "http://optimization:8000"
      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "Xtrena.Api"
      Jwt__Audience: "Xtrena.Client"
    volumes:
      - ./Backend:/src                # ★ LIVE: backend code host එකෙන්
      - nuget:/root/.nuget            # NuGet packages cache — නැවත restore වෙන්නේ නෑ (ඉක්මන්)
    ports:
      - "5080:8080"                   # host 5080 → container 8080
    depends_on:
      db:           { condition: service_healthy }
      optimization: { condition: service_healthy }
    restart: unless-stopped

  # ──────────────────────── ④ FRONTEND (Vite) ────────────────────────
  frontend:
    build: ./Frontend                 # ← ⑥ Dockerfile එක
    environment:
      VITE_API_PROXY: "http://api:8080"   # ★ proxy target = docker network එකේ api එක
    volumes:
      - ./Frontend:/app               # ★ LIVE: host code container එකට
      - frontend_node_modules:/app/node_modules  # ★ container එකේ Linux node_modules (Windows එකේ ඒවා නොවේ!)
    ports:
      - "5173:5173"
    depends_on:
      api: { condition: service_started }
    restart: unless-stopped

volumes:
  sqldata:
  nuget:
  frontend_node_modules: